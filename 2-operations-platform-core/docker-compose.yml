# NOT yet run in CI. Starts the local dependencies (PostgreSQL 16 + Redis 7).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: seleven, POSTGRES_PASSWORD: seleven, POSTGRES_DB: seleven_test }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes: { pgdata: {} }
