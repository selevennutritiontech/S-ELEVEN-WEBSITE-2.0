name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: 4-secure-server
      - run: node --test
        working-directory: 4-secure-server
